name: PrivateRDP v2.3.9 GUARANTEED-SERVER-CURSOR + FAST-CONNECT + VIRTUAL-AUDIO

on:
  workflow_dispatch:
    inputs:
      room_code:
        description: "Room code (same as Android)"
        required: false
        default: "PRIVATE-RDP-2026"
      width:
        description: "Exact Windows/stream width (itel S23 native 1612)"
        required: false
        default: "1612"
      height:
        description: "Encoded/fullscreen height"
        required: false
        default: "720"
      fps:
        description: "Target FPS (15-60)"
        required: false
        default: "60"
      bitrate_mbps:
        description: "H264 bitrate Mbps (hard max 10)"
        required: false
        default: "5.0"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      RDP_SIGNAL_URL: wss://universal-usb-signal.reiseakari.workers.dev/ws
    steps:
      - name: Join Runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
          log-mode: quiet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install v2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install "websockets>=14,<16" "numpy>=2,<3" "mss==10.2.0" "dxcam[winrt]==0.3.0" "av>=14,<17" "soundcard==0.4.5"
          try { Set-Service AudioEndpointBuilder -StartupType Automatic; Start-Service AudioEndpointBuilder } catch { Write-Host "AudioEndpointBuilder start non-fatal: $_" }
          try { Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv } catch { Write-Host "Windows Audio start non-fatal: $_" }
          python -c "import av; c=av.CodecContext.create('libx264','w'); print('libx264 encoder:', c.name)"

      - name: Resolve Tailscale address and firewall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ip=(tailscale ip -4 | Select-Object -First 1).Trim()
          if(-not $ip.StartsWith('100.')){ throw "No Tailscale IPv4: $ip" }
          "RDP_TAILSCALE_IP=$ip" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Runner Tailscale IP: $ip"
          'PrivateRDP v2 UDP','PrivateRDP v2 CONTROL','PrivateRDP v2 VIDEO','PrivateRDP v2 AUDIO' | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 49100 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 CONTROL' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49101 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 VIDEO' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49102 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 AUDIO' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49103 -RemoteAddress '100.64.0.0/10' | Out-Null
          tailscale status
          try { tailscale netcheck } catch { Write-Host 'tailscale netcheck unavailable (non-fatal)' }

      - name: Activate exact 1612x720 VDD display - hard required
        shell: pwsh
        env:
          TARGET_W: ${{ inputs.width }}
          TARGET_H: ${{ inputs.height }}
          TARGET_HZ: "60"
        run: |
          $ErrorActionPreference='Stop'
          $w=[int]$env:TARGET_W
          $h=[int]$env:TARGET_H
          $hz=[int]$env:TARGET_HZ
          if(($w -band 1) -ne 0 -or ($h -band 1) -ne 0){ throw 'H264 4:2:0 target dimensions must be even' }

          Write-Host "=== PrivateRDP v2.3.5.1 exact display bootstrap ==="
          Write-Host "Requested: ${w}x${h}@${hz}"
          Write-Host "Policy: exact VDD required; no 1600x900 fallback, no letterbox, no crop, no stretch"

          Add-Type -AssemblyName System.Windows.Forms

          function Test-ExactActive {
            foreach($s in [System.Windows.Forms.Screen]::AllScreens){
              Write-Host "SCREEN before/now: device=$($s.DeviceName) primary=$($s.Primary) bounds=$($s.Bounds)"
              if($s.Bounds.Width -eq $w -and $s.Bounds.Height -eq $h){ return $true }
            }
            return $false
          }

          if(Test-ExactActive){
            Write-Host "EXACT DISPLAY already active."
            "RDP_EXACT_DISPLAY=1" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            exit 0
          }

          # Use the same VDD configuration shape and install path that the standalone
          # v0.2.1 probe proved as PASS_EXACT_ACTIVE on Windows Server 2022 and 2025.
          $vddRoot='C:\VirtualDisplayDriver'
          New-Item -ItemType Directory -Path $vddRoot -Force | Out-Null
          New-Item -ItemType Directory -Path "$vddRoot\Logs" -Force | Out-Null

          $xml=@"
          <?xml version='1.0' encoding='utf-8'?>
          <vdd_settings>
            <monitors><count>1</count></monitors>
            <gpu><friendlyname>default</friendlyname></gpu>
            <global><g_refresh_rate>$hz</g_refresh_rate></global>
            <resolutions>
              <resolution>
                <width>$w</width>
                <height>$h</height>
                <refresh_rate>$hz</refresh_rate>
              </resolution>
            </resolutions>
            <logging>
              <SendLogsThroughPipe>true</SendLogsThroughPipe>
              <logging>true</logging>
              <debuglogging>true</debuglogging>
            </logging>
            <colour>
              <SDR10bit>false</SDR10bit>
              <HDRPlus>false</HDRPlus>
              <ColourFormat>RGB</ColourFormat>
            </colour>
            <cursor>
              <HardwareCursor>true</HardwareCursor>
              <CursorMaxX>128</CursorMaxX>
              <CursorMaxY>128</CursorMaxY>
              <AlphaCursorSupport>true</AlphaCursorSupport>
              <XorCursorSupportLevel>2</XorCursorSupportLevel>
            </cursor>
            <edid>
              <CustomEdid>false</CustomEdid>
              <PreventSpoof>false</PreventSpoof>
              <EdidCeaOverride>false</EdidCeaOverride>
            </edid>
            <auto_resolutions>
              <enabled>false</enabled>
              <source_priority>manual</source_priority>
              <edid_mode_filtering>
                <min_refresh_rate>24</min_refresh_rate>
                <max_refresh_rate>240</max_refresh_rate>
                <exclude_fractional_rates>false</exclude_fractional_rates>
                <min_resolution_width>640</min_resolution_width>
                <min_resolution_height>480</min_resolution_height>
                <max_resolution_width>7680</max_resolution_width>
                <max_resolution_height>4320</max_resolution_height>
              </edid_mode_filtering>
              <preferred_mode>
                <use_edid_preferred>false</use_edid_preferred>
                <fallback_width>$w</fallback_width>
                <fallback_height>$h</fallback_height>
                <fallback_refresh>$hz</fallback_refresh>
              </preferred_mode>
            </auto_resolutions>
            <color_advanced>
              <bit_depth_management>
                <auto_select_from_color_space>false</auto_select_from_color_space>
                <force_bit_depth>8</force_bit_depth>
                <fp16_surface_support>true</fp16_surface_support>
              </bit_depth_management>
              <color_format_extended><sdr_white_level>80.0</sdr_white_level></color_format_extended>
            </color_advanced>
          </vdd_settings>
          "@
          $enc=[System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $vddRoot 'vdd_settings.xml'),$xml,$enc)

          New-Item -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Name VDDPATH -Value $vddRoot -PropertyType String -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Name LOGS -Value 1 -PropertyType DWord -Force | Out-Null

          $tmp=Join-Path $env:RUNNER_TEMP 'prdp-v235-vdd'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          $nefZip=Join-Path $tmp 'nefcon.zip'
          $drvZip=Join-Path $tmp 'driver.zip'
          Invoke-WebRequest 'https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip' -OutFile $nefZip -UseBasicParsing
          Invoke-WebRequest 'https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip' -OutFile $drvZip -UseBasicParsing
          Expand-Archive $nefZip (Join-Path $tmp 'nef') -Force
          Expand-Archive $drvZip (Join-Path $tmp 'drv') -Force

          $nefexe=Get-ChildItem (Join-Path $tmp 'nef') -Recurse -Filter nefconw.exe | Where-Object FullName -Match '\\x64\\' | Select-Object -First 1
          $inf=Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter MttVDD.inf | Select-Object -First 1
          $cat=Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter mttvdd.cat | Select-Object -First 1
          $dll=Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter MttVDD.dll | Select-Object -First 1
          if(-not $nefexe -or -not $inf -or -not $cat -or -not $dll){ throw 'VDD/NefCon payload layout not recognized' }

          Write-Host "VDD DLL signature:"
          Get-AuthenticodeSignature $dll.FullName | Format-List Status,StatusMessage

          $certs=New-Object Security.Cryptography.X509Certificates.X509Certificate2Collection
          $certs.Import([IO.File]::ReadAllBytes($cat.FullName))
          foreach($c in $certs){
            $cp=Join-Path $tmp ($c.Thumbprint+'.cer')
            [IO.File]::WriteAllBytes($cp,$c.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            Import-Certificate -FilePath $cp -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null
          }

          # IMPORTANT: nefconw.exe can behave like a windowed native process.
          # Calling it bare can return control before PowerShell has a usable
          # $LASTEXITCODE (observed as a blank exit code even though NefCon logs
          # 'Device and driver installed successfully' a moment later).
          # The v0.2.1 probe that PASSed on both Windows 2022/2025 forced the
          # native process through a pipeline, then used PnP ProblemCode=0 as
          # the authoritative success condition. Mirror that proven sequence.
          $nefLog=Join-Path $tmp 'nefcon-install.log'
          & $nefexe.FullName install $inf.FullName 'Root\MttVDD' 2>&1 | Tee-Object -FilePath $nefLog
          $installExit=$LASTEXITCODE
          if($null -eq $installExit){
            Write-Warning 'NefCon produced no immediate exit code; continuing to authoritative PnP verification.'
          } else {
            Write-Host "NefCon install exit=$installExit"
            if([int]$installExit -ne 0){
              Write-Warning "NefCon returned exit=$installExit; PnP verification will decide whether the VDD is actually usable."
            }
          }
          pnputil /scan-devices 2>&1 | ForEach-Object { Write-Host $_ }
          Start-Sleep -Seconds 15

          # Wait for a healthy PnP node. The control pipe is deliberately NOT a
          # success requirement: the successful v0.2.1 probe had pipe=False.
          $healthy=$false
          for($i=0;$i -lt 12;$i++){
            $nodes=Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object {
              $_.InstanceId -match 'MttVDD|MTT1337|ROOT\\MTT' -or $_.FriendlyName -match 'Virtual Display|Mtt|MikeTheTech'
            }
            foreach($d in $nodes){
              $pc=0
              try{$pc=[int](Get-PnpDeviceProperty -InstanceId $d.InstanceId -KeyName 'DEVPKEY_Device_ProblemCode' -ErrorAction Stop).Data}catch{$pc=999}
              Write-Host "VDD PnP: status=$($d.Status) name=$($d.FriendlyName) id=$($d.InstanceId) problem=$pc"
              if($pc -eq 0){$healthy=$true}
            }
            if($healthy){break}
            Start-Sleep -Seconds 2
          }
          if(-not $healthy){ throw 'VDD PnP node did not become healthy (ProblemCode 0)' }

          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class PRDPExactDisplay235 {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DISPLAY_DEVICE { public int cb; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string DeviceName; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceString; public int StateFlags; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceID; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceKey; }
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE { [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmDeviceName; public short dmSpecVersion,dmDriverVersion,dmSize,dmDriverExtra; public int dmFields,dmPositionX,dmPositionY,dmDisplayOrientation,dmDisplayFixedOutput; public short dmColor,dmDuplex,dmYResolution,dmTTOption,dmCollate; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmFormName; public short dmLogPixels; public int dmBitsPerPel,dmPelsWidth,dmPelsHeight,dmDisplayFlags,dmDisplayFrequency; public int dmICMMethod,dmICMIntent,dmMediaType,dmDitherType,dmReserved1,dmReserved2,dmPanningWidth,dmPanningHeight; }
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplayDevices(string a,uint i,ref DISPLAY_DEVICE d,uint f);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplaySettingsEx(string n,int i,ref DEVMODE m,uint f);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string n,ref DEVMODE m,IntPtr h,uint f,IntPtr p);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string n,IntPtr m,IntPtr h,uint f,IntPtr p);
            const int CUR=-1, ATT=1, PRI=4; const int DM_POSITION=0x20,DM_FREQ=0x400000,DM_W=0x80000,DM_H=0x100000; const uint CDS_UP=1,CDS_TEST=2,CDS_PRIMARY=0x10;
            static DISPLAY_DEVICE DD(){var d=new DISPLAY_DEVICE();d.cb=Marshal.SizeOf(typeof(DISPLAY_DEVICE));return d;}
            static DEVMODE DM(){var m=new DEVMODE();m.dmSize=(short)Marshal.SizeOf(typeof(DEVMODE));return m;}
            public static string Dump(int w,int h,int hz){
              var sb=new StringBuilder();
              for(uint i=0;i<32;i++){
                var d=DD(); if(!EnumDisplayDevices(null,i,ref d,0))break;
                sb.AppendLine($"DEV {i} {d.DeviceName} desc={d.DeviceString} flags=0x{d.StateFlags:X} id={d.DeviceID}");
                var c=DM(); if(EnumDisplaySettingsEx(d.DeviceName,CUR,ref c,0))sb.AppendLine($" CURRENT {c.dmPelsWidth}x{c.dmPelsHeight}@{c.dmDisplayFrequency} pos={c.dmPositionX},{c.dmPositionY}");
                bool ex=false;
                for(int x=0;x<4096;x++){
                  var m=DM(); if(!EnumDisplaySettingsEx(d.DeviceName,x,ref m,0))break;
                  if(m.dmPelsWidth==w&&m.dmPelsHeight==h&&(hz<=0||m.dmDisplayFrequency==hz))ex=true;
                }
                sb.AppendLine(" EXACT_EXPOSED="+ex);
              }
              return sb.ToString();
            }
            public static string Apply(int w,int h,int hz){
              var sb=new StringBuilder(); bool any=false;
              for(uint i=0;i<32;i++){
                var d=DD(); if(!EnumDisplayDevices(null,i,ref d,0))break;
                DEVMODE best=DM(); bool have=false;
                for(int x=0;x<4096;x++){
                  var m=DM(); if(!EnumDisplaySettingsEx(d.DeviceName,x,ref m,0))break;
                  if(m.dmPelsWidth==w&&m.dmPelsHeight==h&&(hz<=0||m.dmDisplayFrequency==hz)){best=m;have=true;break;}
                }
                if(!have)continue;
                any=true;
                var t=best;
                int tr=ChangeDisplaySettingsEx(d.DeviceName,ref t,IntPtr.Zero,CDS_TEST,IntPtr.Zero);
                sb.AppendLine($"TEST {d.DeviceName} {d.DeviceString} result={tr}");
                if(tr==0){
                  best.dmFields|=DM_W|DM_H|DM_POSITION;
                  if(best.dmDisplayFrequency>0)best.dmFields|=DM_FREQ;
                  best.dmPositionX=0; best.dmPositionY=0;
                  int ar=ChangeDisplaySettingsEx(d.DeviceName,ref best,IntPtr.Zero,CDS_UP|CDS_PRIMARY,IntPtr.Zero);
                  int cr=ChangeDisplaySettingsEx(null,IntPtr.Zero,IntPtr.Zero,0,IntPtr.Zero);
                  sb.AppendLine($"APPLY result={ar} commit={cr}");
                }
              }
              if(!any)sb.AppendLine("NO_DEVICE_EXPOSES_EXACT_MODE");
              return sb.ToString();
            }
          }
          '@

          & "$env:SystemRoot\System32\DisplaySwitch.exe" /extend | Out-Null
          Start-Sleep -Seconds 4

          $passed=$false
          for($attempt=1;$attempt -le 8;$attempt++){
            Write-Host "=== exact display attempt $attempt ==="
            $dump=[PRDPExactDisplay235]::Dump($w,$h,$hz)
            Write-Host $dump
            if($dump -match 'EXACT_EXPOSED=True'){
              $apply=[PRDPExactDisplay235]::Apply($w,$h,$hz)
              Write-Host $apply
              Start-Sleep -Seconds 3
            } else {
              & "$env:SystemRoot\System32\DisplaySwitch.exe" /extend | Out-Null
              Start-Sleep -Seconds 2
            }
            if(Test-ExactActive){$passed=$true;break}
          }

          if(-not $passed){
            Write-Host '=== final PnP ==='
            Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Format-Table -AutoSize
            Write-Host '=== final display dump ==='
            Write-Host ([PRDPExactDisplay235]::Dump($w,$h,$hz))
            throw "DISPLAY_EXACT_FAILED expected=${w}x${h}@${hz}; streaming intentionally not started"
          }

          Write-Host "PASS_EXACT_ACTIVE ${w}x${h}@${hz}"
          try{
            Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 600
            Start-Process explorer.exe
          }catch{ Write-Host "Explorer refresh non-fatal: $_" }
          "RDP_EXACT_DISPLAY=1" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append


      - name: Install fixed virtual audio endpoint - hard required
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Write-Host '=== PrivateRDP v2.3.6 virtual audio bootstrap ==='
          $tmp=Join-Path $env:RUNNER_TEMP 'prdp-v236-vad'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          $rel=Invoke-RestMethod -Headers @{ 'User-Agent'='PrivateRDP-v2.3.8' } -Uri 'https://api.github.com/repos/VirtualDrivers/Virtual-Audio-Driver/releases/tags/25.7.14'
          $asset=$rel.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          if(-not $asset){ throw 'Virtual Audio Driver 25.7.14 ZIP asset not found' }
          $zip=Join-Path $tmp 'vad.zip'
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip -UseBasicParsing
          $drv=Join-Path $tmp 'drv'
          Expand-Archive $zip $drv -Force
          $inf=Get-ChildItem $drv -Recurse -Filter VirtualAudioDriver.inf | Select-Object -First 1
          $cat=Get-ChildItem $drv -Recurse -Filter virtualaudiodriver.cat | Select-Object -First 1
          if(-not $inf){ throw 'VirtualAudioDriver.inf missing from signed release' }

          if($cat){
            try{
              $certs=New-Object Security.Cryptography.X509Certificates.X509Certificate2Collection
              $certs.Import([IO.File]::ReadAllBytes($cat.FullName))
              foreach($c in $certs){
                $cp=Join-Path $tmp ($c.Thumbprint+'.cer')
                [IO.File]::WriteAllBytes($cp,$c.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
                Import-Certificate -FilePath $cp -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null
              }
            }catch{ Write-Warning "VAD catalog certificate import: $_" }
          }

          $nefZip=Join-Path $tmp 'nefcon.zip'
          Invoke-WebRequest 'https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip' -OutFile $nefZip -UseBasicParsing
          $nef=Join-Path $tmp 'nef'
          Expand-Archive $nefZip $nef -Force
          $nefexe=Get-ChildItem $nef -Recurse -Filter nefconw.exe | Where-Object FullName -Match '\\x64\\' | Select-Object -First 1
          if(-not $nefexe){ throw 'nefconw x64 missing' }
          & $nefexe.FullName install $inf.FullName 'ROOT\VirtualAudioDriver' 2>&1 | ForEach-Object { Write-Host $_ }
          pnputil /scan-devices 2>&1 | ForEach-Object { Write-Host $_ }
          Start-Sleep -Seconds 8
          try { Set-Service AudioEndpointBuilder -StartupType Automatic; Start-Service AudioEndpointBuilder } catch {}
          try { Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv } catch {}
          Start-Sleep -Seconds 4

          $nodes=Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { $_.InstanceId -match 'VirtualAudioDriver' -or $_.FriendlyName -match 'Virtual Audio' }
          if(-not $nodes){ throw 'Virtual Audio Driver PnP node not found' }
          $healthy=$false
          foreach($d in $nodes){
            $pc=999
            try{$pc=[int](Get-PnpDeviceProperty -InstanceId $d.InstanceId -KeyName 'DEVPKEY_Device_ProblemCode' -ErrorAction Stop).Data}catch{}
            Write-Host "VAD PnP: status=$($d.Status) name=$($d.FriendlyName) id=$($d.InstanceId) problem=$pc"
            if($pc -eq 0){$healthy=$true}
          }
          if(-not $healthy){throw 'Virtual Audio Driver did not reach ProblemCode 0'}

          python -c "import soundcard as sc; print('speakers=', [x.name for x in sc.all_speakers()]); s=sc.default_speaker(); print('default=', None if s is None else s.name); assert s is not None, 'no default render endpoint'"

      - name: Materialize v2.3.9 host
        shell: pwsh
        run: |
          $b64=''
          $path=Join-Path $env:RUNNER_TEMP 'prdp_v239_host.py'
          [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String($b64))
          python -m py_compile $path
          "RDP_HOST_SCRIPT=$path" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Host script ready: $path"

      - name: Run PrivateRDP v2.3.9
        shell: pwsh
        env:
          RDP_ROOM: ${{ inputs.room_code }}
          RDP_WIDTH: ${{ inputs.width }}
          RDP_HEIGHT: ${{ inputs.height }}
          RDP_FPS: ${{ inputs.fps }}
          RDP_BITRATE_MBPS: ${{ inputs.bitrate_mbps }}
        run: |
          $ErrorActionPreference='Stop'
          $room=($env:RDP_ROOM -replace '[^A-Za-z0-9]','').ToUpperInvariant()
          if($room.Length -lt 12){throw 'room_code must contain at least 12 alphanumeric characters'}
          $bytes=New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $token=([Convert]::ToHexString($bytes)).ToLowerInvariant()
          $generation="${{ github.run_id }}-${{ github.run_attempt }}"
          $started=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $env:RDP_ROOM=$room
          $env:RDP_SESSION_TOKEN=$token
          $env:RDP_GENERATION=$generation
          $env:RDP_STARTED_AT_MS=$started.ToString()
          $env:RDP_UDP_PORT='49100'
          $env:RDP_TCP_PORT='49101'
          $env:RDP_VIDEO_PORT='49102'
          $env:RDP_AUDIO_PORT='49103'
          $env:RDP_AUDIO_RATE='48000'
          $env:DXCAM_WINRT_CURSOR_CAPTURE='0' # deterministic: cursor is composited by the host for every backend
          $env:DXCAM_WINRT_BORDER_REQUIRED='0'
          $env:DXCAM_WINRT_FRAME_WAIT_MS='0'
          $env:DXCAM_WINRT_MIN_UPDATE_INTERVAL_MS='0'
          $env:DXCAM_WINRT_FRAME_POOL_SIZE='2'
          Write-Host '=== PrivateRDP v2.3.9 GUARANTEED SERVER CURSOR + FAST CONNECT + VIRTUAL AUDIO ==='
          Write-Host "Room       : $room"
          Write-Host "Generation : $generation"
          Write-Host "Tailnet IP : $env:RDP_TAILSCALE_IP"
          Write-Host "Stream     : $env:RDP_WIDTH x $env:RDP_HEIGHT @ $env:RDP_FPS fps"
          Write-Host "Bitrate    : $env:RDP_BITRATE_MBPS Mbps (hard cap 10 Mbps)"
          Write-Host 'Display    : HARD exact VDD source required; native 1:1; crop=0 stretch=0 letterbox=0'
          Write-Host 'Mouse      : actual Runner cursor position composited into every frame + latest-only CONTROL-TCP MOVE'
          Write-Host 'Transport  : UDP liveness + TCP mouse/control + H264/TCP video + PCM/TCP audio over Tailscale'
          python -u $env:RDP_HOST_SCRIPT
