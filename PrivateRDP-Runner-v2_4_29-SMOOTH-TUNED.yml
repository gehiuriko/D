# PrivateRDP Runner — Smooth Tuning Profile (v2.4.29)
# Disusun dari analisis log diagnostik client v2.4.22.
# File upload sebelumnya adalah dump telemetry/log runtime, BUKAN config asli —
# key di bawah ini adalah mapping berdasar parameter yang muncul di log.
# Kalau beda nama dengan config asli runner lo, sesuaikan key-nya, logikanya tetap sama.

transport:
  mode: direct              # pertahankan direct path lewat tailnet, hindari relay/DERP kalau bisa
  video: udp
  control: tcp
  audio: tcp

video:
  codec: h264
  capture: native-dxgi-duplicate-output
  resolution: 1612x720
  fps: 60
  bitrate_mode: fixed       # sudah benar di config lama, JANGAN diubah
  adaptive_bitrate: false   # eksplisit off — ini yang lo mau

fec:
  data_shards: 4
  parity_shards: 3          # naik dari 2 -> 3
  # log nunjukin burst loss size 3 = 631x, size 4+ = 326x dalam satu sesi.
  # FEC 4+2 cuma nutup burst sampai 2 paket hilang beruntun; 4+3 nutup sampai 3
  # dan ngurangin peluang kena yang 4+ juga karena window recovery lebih longgar.

udp_reorder:
  reorder_deadline_ms: 120  # naik drastis dari 24ms
  # INI AKAR MASALAH MICRO-STUTTER. 24ms itu ketat banget buat jalur dengan ping
  # 228ms — paket yang cuma telat dikit langsung dianggap "broken chain" dan
  # maksa IDR wait, padahal FEC sebenernya masih sanggup nge-recover kalau
  # dikasih waktu. 120ms (~setengah RTT) ngasih ruang buat FEC+reorder buffer
  # kerja sebelum app nyerah dan minta keyframe baru.
  idr_wait_cooldown_ms: 500 # jangan langsung nembak IDR request lagi tiap ada gap baru

liveness:
  hello_interval_ms: 2000
  hello_ack_timeout_ms: 8000   # naik dari default pendek yang bikin "HELLO ACK stale" tiap 20-90 detik
  on_liveness_lost: recreate_socket_only
  decouple_decoder_reset_from_socket_recreate: true
  # ini yang bikin freeze BENERAN (bukan micro-stutter): tiap socket UDP
  # di-recreate, decoder ikut di-release dan presentation full pause, padahal
  # cuma soketnya yang perlu diganti. Begitu HELLO2 ACK confirm path baru,
  # lanjutin decoder yang sama — jangan acquire lease/epoch baru tiap kali.

idr_refresh:
  periodic_interval_sec: 8  # naik dikit dari ~5.5s, ngurangin beban I-frame berulang
  on_demand_on_gap: true

audio:
  tcp_read_timeout_ms: 20000  # naik drastis dari ~3000-3700ms (lihat "Read timed out" tiap 3-4 detik di log)
  tcp_keepalive_ms: 5000
  reconnect_backoff_ms: 1000
